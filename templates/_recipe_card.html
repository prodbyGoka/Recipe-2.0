<article class="recipe-card">
  <a class="recipe-photo" href="{{ url_for('recipe_detail', recipe_id=recipe.id) }}"><img src="{{ recipe_image(recipe.id) }}" alt="A serving suggestion for {{ recipe.title }}" loading="lazy"><span class="photo-tag">{{ recipe.meal_type|capitalize }}</span></a>
  <div class="recipe-card-body"><h3><a href="{{ url_for('recipe_detail', recipe_id=recipe.id) }}">{{ recipe.title }}</a></h3><p>{{ recipe.description }}</p><div class="recipe-meta"><span class="rating">★ {{ recipe.average_rating or 'New' }}</span><span>{{ recipe.time_minutes }} min</span><span>{{ recipe.ingredient_links|length }} ingredients</span></div></div>
</article>
